plugin: aws_ec2
regions:
  - eu-west-1

filters:
  instance-state-name: running
  tag:Name: greenleaf-prod-prestashop

hostnames:
  - instance-id

keyed_groups:
  - key: tags.Environment
    prefix: env
  - key: tags.Name
    prefix: name

compose:
  ansible_host: public_ip_address
  ansible_user: ec2-user
