plugin: aws_ec2
regions:
  - eu-west-1
  - eu-central-1
filters:
  tag:Project: GreenLeaf
hostnames:
  - ip-address
  - private-ip-address
keyed_groups:
  - key: tags.Environment
    prefix: env
  - key: tags.Name
    prefix: name
compose:
  ansible_host: public_ip_address
  ansible_user: ec2-user

