---
# Magento Configuration
magento_version: "2.4.7"
magento_install_dir: "/var/www/magento"
magento_admin_firstname: "Admin"
magento_admin_lastname: "User"
magento_admin_email: "admin@greenleaf.example.com"
magento_admin_username: "admin"
magento_admin_password: "ChangeMe123!"
magento_base_url: ""  # Will be set dynamically
magento_backend_frontname: "admin"
magento_language: "en_US"
magento_currency: "USD"
magento_timezone: "America/New_York"

# PHP Configuration
php_version: "8.2"
php_memory_limit: "2G"
php_max_execution_time: 600
php_max_input_vars: 20000

# Database Configuration (will be passed via vars or SSM Parameter Store)
db_host: ""  # Will be set dynamically
db_name: "magento"
db_user: "admin"
db_password: ""  # Will be set dynamically

# Nginx Configuration
nginx_worker_processes: "auto"
nginx_worker_connections: 1024
nginx_keepalive_timeout: 65

# S3 Configuration
s3_bucket_name: ""  # Will be set dynamically
cloudfront_url: ""  # Will be set dynamically

# CloudWatch Configuration
cloudwatch_log_groups:
  - name: "/aws/ec2/greenleaf/prod/nginx/access"
    retention_days: 7
  - name: "/aws/ec2/greenleaf/prod/nginx/error"
    retention_days: 7
  - name: "/aws/ec2/greenleaf/prod/magento/system"
    retention_days: 7

# System Configuration
timezone: "UTC"

