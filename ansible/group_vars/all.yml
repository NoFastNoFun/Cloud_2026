---
# PrestaShop Configuration
prestashop_version: "8.*"
prestashop_install_dir: "/var/www/prestashop"
prestashop_admin_firstname: "Admin"
prestashop_admin_lastname: "User"
prestashop_admin_email: "admin@greenleaf.example.com"
prestashop_admin_password: "ChangeMe123!"
prestashop_domain: "presta.nf2.dev"
prestashop_language: "en"
prestashop_country: "us"
prestashop_timezone: "America/New_York"

# PHP Configuration
php_version: "8.2"
php_memory_limit: "512M"
php_max_execution_time: 300
php_max_input_vars: 5000

# Database Configuration (will be passed via vars or SSM Parameter Store)
db_host: ""  # Will be set dynamically
db_name: "prestashop"
db_user: "admin"
db_password: ""  # Will be set dynamically

# Nginx Configuration
nginx_worker_processes: "auto"
nginx_worker_connections: 1024
nginx_keepalive_timeout: 65

# S3 Configuration
s3_bucket_name: ""  # Will be set dynamically
cloudfront_url: ""  # Will be set dynamically

# CloudWatch Configuration
cloudwatch_log_groups:
  - name: "/aws/ec2/greenleaf/prod/nginx/access"
    retention_days: 7
  - name: "/aws/ec2/greenleaf/prod/nginx/error"
    retention_days: 7
  - name: "/aws/ec2/greenleaf/prod/prestashop/system"
    retention_days: 7

# System Configuration
timezone: "UTC"
