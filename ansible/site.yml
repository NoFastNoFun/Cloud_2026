---
- name: Configure Magento E-commerce Platform
  hosts: all
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Update system packages
      package:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

  roles:
    - common
    - nginx
    - php
    - mysql-client
    - magento
    - cloudwatch-agent

  post_tasks:
    - name: Ensure services are running
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - php-fpm
        - amazon-cloudwatch-agent

