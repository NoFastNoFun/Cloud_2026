---
- name: Install Composer
  get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-installer.php
    mode: '0644'

- name: Run Composer installer
  command: php /tmp/composer-installer.php
  args:
    creates: /usr/local/bin/composer
    chdir: /tmp

- name: Make Composer executable
  file:
    path: /usr/local/bin/composer
    mode: '0755'
    state: file

- name: Create PrestaShop directory
  file:
    path: "{{ prestashop_install_dir }}"
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'

- name: Install PrestaShop via Composer
  command: >
    /usr/local/bin/composer create-project prestashop/prestashop {{ prestashop_install_dir }} "{{ prestashop_version }}" --no-dev --prefer-dist --no-interaction
  args:
    creates: "{{ prestashop_install_dir }}/app/config/parameters.php"
  become_user: nginx
  environment:
    COMPOSER_HOME: /tmp/composer

- name: Set PrestaShop permissions
  file:
    path: "{{ item }}"
    owner: nginx
    group: nginx
    mode: '{{ "0775" if item.endswith("/") else "0664" }}'
    recurse: yes
  loop:
    - "{{ prestashop_install_dir }}/var"
    - "{{ prestashop_install_dir }}/var/cache"
    - "{{ prestashop_install_dir }}/var/logs"
    - "{{ prestashop_install_dir }}/img"
    - "{{ prestashop_install_dir }}/upload"
    - "{{ prestashop_install_dir }}/download"
    - "{{ prestashop_install_dir }}/app/config"

- name: Install PrestaShop via CLI
  command: >
    php install/index_cli.php
    --domain={{ prestashop_domain }}
    --db_server={{ db_host }}
    --db_name={{ db_name }}
    --db_user={{ db_user }}
    --db_password={{ db_password }}
    --email={{ prestashop_admin_email }}
    --password={{ prestashop_admin_password }}
    --firstname={{ prestashop_admin_firstname }}
    --lastname={{ prestashop_admin_lastname }}
    --language={{ prestashop_language }}
    --country={{ prestashop_country }}
    --newsletter=0
    --send_email=0
  args:
    chdir: "{{ prestashop_install_dir }}"
    creates: "{{ prestashop_install_dir }}/app/config/parameters.php"
  become_user: nginx
  when: db_host != "" and db_password != ""

- name: Check if PrestaShop is installed
  stat:
    path: "{{ prestashop_install_dir }}/app/config/parameters.php"
  register: prestashop_installed

- name: Remove install directory after installation
  file:
    path: "{{ prestashop_install_dir }}/install"
    state: absent
  when: db_host != "" and db_password != "" and prestashop_installed.stat.exists

- name: Create health check file
  copy:
    content: "OK"
    dest: "{{ prestashop_install_dir }}/health_check.php"
    owner: nginx
    group: nginx
    mode: '0644'

