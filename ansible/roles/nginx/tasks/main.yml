---
- name: Install Nginx
  package:
    name: nginx
    state: present

- name: Remove default Nginx configuration
  file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Configure Nginx for Magento
  template:
    src: magento.conf.j2
    dest: /etc/nginx/conf.d/magento.conf
    mode: '0644'
  notify: restart nginx

- name: Ensure Nginx is started and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes

